[package]
name = "peruse-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "A fast, read-only viewer for Parquet, CSV, TSV and JSON data files."

[[bin]]
name = "peruse"
path = "src/main.rs"

# `cargo binstall peruse-tui` takes the program from a release of the project
# and does not build it. The build compiles DuckDB from source and needs some
# minutes, so this is the quick way in for a user who has Rust.
#
# The names here must agree with `.github/workflows/release.yml`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/peruse-{ version }-{ target }.tar.gz"
bin-dir = "peruse-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/peruse-{ version }-{ target }.zip"
pkg-fmt = "zip"

# See the note in `peruse-core/Cargo.toml`: one target, because each one
# compiles DuckDB again.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[dependencies]
peruse-core = { path = "../peruse-core", version = "0.2.0" }
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
ratatui.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

# The tests of the whole program open a DuckDB database file, and no test can
# open one without writing one first. The library is in the build already,
# through `peruse-core`, so this line adds nothing to the program itself.
[dev-dependencies]
duckdb.workspace = true
