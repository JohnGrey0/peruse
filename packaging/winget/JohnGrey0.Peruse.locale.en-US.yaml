ShortDescription: A fast, read-only viewer for Parquet, CSV, TSV and JSON data files.
Description: |-
  Peruse opens a data file in the terminal and shows it as a table. It reads
  Parquet, CSV, TSV and JSON, and it reads a file that is larger than the
  memory of the machine.

  You can sort a column, filter the rows with a builder or with SQL, search
  the text, read one record on its own, open the structures inside a JSON
  value, and see the metadata and the statistics of each column. It can also
  write the DDL for a table in Oracle, MySQL, Snowflake, PostgreSQL and
  others from the shape of the file.

  Peruse never writes to your file. It opens it read-only, and it refuses any
  statement that would change data.
