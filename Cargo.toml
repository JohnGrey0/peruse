[workspace]
resolver = "3"
members = ["crates/peruse-core", "crates/peruse-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/JohnGrey0/peruse"
homepage = "https://github.com/JohnGrey0/peruse"
documentation = "https://github.com/JohnGrey0/peruse#readme"
description = "A fast, read-only viewer for Parquet, CSV, TSV and JSON data files."
keywords = ["parquet", "csv", "json", "tui", "duckdb"]
categories = ["command-line-utilities", "database", "visualization"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6"
duckdb = { version = "1.10505", features = ["bundled", "parquet", "json"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
# Only the memory and the processor list. The default features also collect
# each process of the system, and Peruse has no use for those.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# The feature `preserve_order` keeps the fields of an object in the order that
# the file holds them. Without it, the record view would show the columns in
# the order of the alphabet, and not in the order of the file.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The bundled DuckDB C++ amalgamation is enormous and never changes between our
# builds. Always optimise it, even in debug, or dev builds are unusably slow.
[profile.dev.package.libduckdb-sys]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
